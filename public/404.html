<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Oussama El Alaoui</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background-color: #0b0c0a;
        color: #f3f6f2;
        font-family: "Inter", -apple-system, sans-serif;
        text-align: center;
        padding: 24px;
      }
      h1 {
        font-size: clamp(4rem, 12vw, 7rem);
        margin: 0;
        line-height: 1;
        color: #22c55e;
        letter-spacing: -0.02em;
      }
      p {
        color: #9aa39b;
        font-size: 1.1rem;
        margin: 0;
      }
      a {
        margin-top: 16px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 24px;
        border-radius: 9999px;
        background: #22c55e;
        color: #06230f;
        font-weight: 600;
        text-decoration: none;
        transition: transform 0.2s ease, background 0.2s ease;
      }
      a:hover {
        transform: translateY(-2px);
        background: #4ade80;
      }
    </style>
  </head>
  <body>
    <h1>404</h1>
    <p>Oops! The page you're looking for doesn't exist.</p>
    <a href="/">Back to Home</a>
  </body>
</html>
